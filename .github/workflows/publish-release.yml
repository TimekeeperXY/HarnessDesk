name: Publish release artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful packaging workflow run ID
        required: true
      tag:
        description: Existing draft release tag
        required: true
        default: v0.2.2

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: HarnessDesk-windows-x64
          path: artifacts/windows
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download Apple Silicon artifact
        uses: actions/download-artifact@v5
        with:
          name: HarnessDesk-macos-arm64
          path: artifacts/macos-arm64
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Select release files
        shell: bash
        run: |
          mkdir publish
          find artifacts/windows -type f -name 'HarnessDesk-*-win-x64.exe' -exec cp '{}' publish/ \;
          find artifacts/macos-arm64 -type f \( -name 'HarnessDesk-*-mac-arm64.dmg' -o -name 'HarnessDesk-*-mac-arm64.zip' \) -exec cp '{}' publish/ \;
          test "$(find publish -maxdepth 1 -type f | wc -l)" -eq 3
          ls -lh publish

      - name: Upload and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ inputs.tag }}" publish/* --repo "${{ github.repository }}" --clobber
          gh release edit "${{ inputs.tag }}" --repo "${{ github.repository }}" --draft=false --prerelease --latest=false
